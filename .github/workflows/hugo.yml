name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  SITE_URL: https://blog.heliomedeiros.com/

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "$SITE_URL"
      - name: Check internal links
        run: python3 scripts/check_links.py public
      - name: Stamp the build
        run: echo "$GITHUB_SHA" > public/version.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test the built site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          site="${{ runner.temp }}/smoke-site"
          hugo --minify --baseURL http://127.0.0.1:1313/ -d "$site" --quiet
          python3 -m http.server 1313 --bind 127.0.0.1 --directory "$site" > /dev/null 2>&1 &
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:1313/ && break
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:1313/
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the new build to be served
        run: |
          for attempt in $(seq 40); do
            got=$(curl -fsS "${SITE_URL}version.txt?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "verify-live: $SITE_URL serves build $GITHUB_SHA"
              exit 0
            fi
            echo "verify-live: attempt $attempt serves '${got:0:40}', waiting for $GITHUB_SHA"
            sleep 15
          done
          echo "::error::verify-live: $SITE_URL never served build $GITHUB_SHA"
          exit 1
      - name: Smoke test the live site
        run: npm run smoke -- "$SITE_URL"
