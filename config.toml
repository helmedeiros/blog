baseurl = "https://blog.heliomedeiros.com/"
defaultContentLanguage = "en"
title = "helio."
theme = "helio"
enableRobotsTXT = true

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    title = "helio."
    weight = 1
    contentDir = "content/en"
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/"
      weight = 1

  [languages.pt]
    locale = "pt-br"
    label = "Português"
    title = "helio."
    weight = 2
    contentDir = "content/pt"
    [[languages.pt.menu.main]]
      name = "Posts"
      url = "/"
      weight = 1

[pagination]
  pagerSize = 50

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  homeTitle = "helio."
  googleFonts = "family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700;800&display=swap"
  subtitle = "Technology insights and agile development"
  comments = false
  disqusShortname = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    codeFences = true
    guessSyntax = true
